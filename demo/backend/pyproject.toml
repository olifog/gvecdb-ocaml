[project]
name = "arxiv-demo"
version = "0.1.0"
description = "arXiv research paper explorer demo for gvecdb"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pycapnp>=2.0.0",
    "boto3>=1.35",
    "pydantic>=2.9",
    "httpx>=0.28",
    "rich>=13.0",
]

[project.scripts]
ingest = "arxiv_demo.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_demo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
