name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up OxCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.5.2.0+ox
          opam-repositories: |
            oxcaml: "git+https://github.com/oxcaml/opam-repository.git"
            default: "git+https://github.com/ocaml/opam-repository.git"
          opam-pin: false
          opam-disable-sandboxing: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y liblmdb-dev capnproto

      - name: Pin dependencies
        run: |
          opam pin add capnp-rpc.2.1.1 git+https://github.com/mirage/capnp-rpc.git#00423406c03cafcbf31174cb8bacb03f3ee03f5e -n
          opam pin add capnp-rpc-net.2.1.1 git+https://github.com/mirage/capnp-rpc.git#00423406c03cafcbf31174cb8bacb03f3ee03f5e -n
          opam pin add capnp-rpc-unix.2.1.1 git+https://github.com/mirage/capnp-rpc.git#00423406c03cafcbf31174cb8bacb03f3ee03f5e -n
          opam pin add digestif.1.3.0 git+https://github.com/mirage/digestif.git -n

      - name: Install OCaml dependencies
        run: opam install . --deps-only --with-test -y

      - name: Build
        run: opam exec -- dune build

      - name: Run tests
        run: opam exec -- dune runtest
